<div class="w-56 bg-white flex flex-col h-full overflow-hidden">
  <div class="flex items-center gap-2 px-4 py-4 border-b border-gray-100">
    <i data-lucide="landmark" class="h-5 w-5 text-indigo-600"></i>
    <span class="text-sm font-semibold text-gray-900">{{ t "ui.page.citizen_portal_short" }}</span>
  </div>
  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
    <a href="/citizen"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-sm transition {{ if eq .CurrentPath "/citizen" }}bg-gray-100 text-gray-900 font-medium{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
      <i data-lucide="home" class="h-4 w-4"></i>
      {{ t "ui.nav.citizen.home" }}
    </a>
    <a href="/citizen/services"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-sm transition {{ if eq .CurrentPath "/citizen/services" }}bg-gray-100 text-gray-900 font-medium{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
      <i data-lucide="layers" class="h-4 w-4"></i>
      {{ t "ui.nav.citizen.services" }}
    </a>
    <a href="/citizen/applications"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-sm transition {{ if eq .CurrentPath "/citizen/applications" }}bg-gray-100 text-gray-900 font-medium{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
      <i data-lucide="file-text" class="h-4 w-4"></i>
      {{ t "ui.nav.citizen.my_applications" }}
    </a>
    <a href="/citizen/notifications"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-sm transition {{ if eq .CurrentPath "/citizen/notifications" }}bg-gray-100 text-gray-900 font-medium{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
      <i data-lucide="bell" class="h-4 w-4"></i>
      {{ t "ui.nav.citizen.notifications" }}
    </a>
    <a href="/citizen/profile"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-sm transition {{ if eq .CurrentPath "/citizen/profile" }}bg-gray-100 text-gray-900 font-medium{{ else }}text-gray-600 hover:bg-gray-50 hover:text-gray-900{{ end }}">
      <i data-lucide="user-circle" class="h-4 w-4"></i>
      {{ t "ui.nav.citizen.profile" }}
    </a>
  </nav>
  <div class="px-3 py-3 border-t border-gray-100 mt-auto shrink-0 bg-white">
    <a href="/logout"
       class="flex items-center gap-3 px-3 py-2 rounded-md text-sm text-gray-600 hover:bg-red-50 hover:text-red-600 transition">
      <i data-lucide="log-out" class="h-4 w-4"></i>
      {{ t "ui.topbar.logout" }}
    </a>
  </div>
</div>
